<!-- @dsCard group="Colors" viewport="700x150" name="Secondary palette" subtitle="Orange energy, periwinkle, pink, peach" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:20px}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;min-height:104px;border:1px solid var(--border-subtle)}
.name{font-weight:800;font-size:13px}.hex{font-size:11px;font-weight:600;opacity:.8;letter-spacing:.03em}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--brand-orange);color:#fff"><div class="name">Orange</div><div class="hex">#EF7D13</div></div>
<div class="sw" style="background:var(--brand-periwinkle);color:#fff"><div class="name">Periwinkle</div><div class="hex">#7592BE</div></div>
<div class="sw" style="background:var(--brand-pink);color:var(--brand-navy)"><div class="name">Salmon Pink</div><div class="hex">#F09192</div></div>
<div class="sw" style="background:var(--brand-peach);color:var(--brand-navy)"><div class="name">Peach</div><div class="hex">#F3DDD0</div></div>
</div></body></html>

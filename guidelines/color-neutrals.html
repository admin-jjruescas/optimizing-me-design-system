<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & text" subtitle="Near-black body, borders, surfaces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:20px}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;min-height:104px;border:1px solid var(--border-subtle)}
.name{font-weight:800;font-size:13px}.hex{font-size:11px;font-weight:600;opacity:.8}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--brand-dark);color:#fff"><div class="name">Near Black</div><div class="hex">#222222 · body text</div></div>
<div class="sw" style="background:var(--cream-50);color:var(--brand-navy)"><div class="name">Cream 50</div><div class="hex">#FCF7F3 · warm page</div></div>
<div class="sw" style="background:var(--peach-100);color:var(--brand-navy)"><div class="name">Peach 100</div><div class="hex">#F9EDE4 · soft surface</div></div>
<div class="sw" style="background:#fff;color:var(--brand-navy)"><div class="name">White</div><div class="hex">#FFFFFF · card</div></div>
</div></body></html>

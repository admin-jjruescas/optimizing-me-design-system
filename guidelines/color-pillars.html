<!-- @dsCard group="Colors" viewport="700x150" name="HumanOps pillar colors" subtitle="Blue loop & orange loop" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:20px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw{border-radius:var(--radius-md);min-height:92px;display:flex;align-items:flex-end;padding:10px;color:#fff}
.name{font-weight:800;font-size:10.5px;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.3)}</style></head>
<body><div class="grid">
<div class="sw" style="background:var(--pillar-respiration)"><div class="name">Respiration</div></div>
<div class="sw" style="background:var(--pillar-emotions)"><div class="name">Emotions</div></div>
<div class="sw" style="background:var(--pillar-movement)"><div class="name">Movement</div></div>
<div class="sw" style="background:var(--pillar-nutrition)"><div class="name">Nutrition</div></div>
<div class="sw" style="background:var(--pillar-mindset)"><div class="name">Mindset</div></div>
<div class="sw" style="background:var(--pillar-recovery)"><div class="name" style="color:var(--brand-navy);text-shadow:none">Recovery</div></div>
</div></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:20px}
.row{display:flex;gap:16px;align-items:stretch}
.sw{flex:1;border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;justify-content:flex-end;min-height:104px;border:1px solid var(--border-subtle)}
.name{font-weight:800;font-size:14px}.hex{font-size:12px;font-weight:600;opacity:.75;letter-spacing:.04em}.role{font-size:11px;font-weight:600;margin-top:4px}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--brand-navy);color:#fff;flex:2">
<div class="name">Navy Blue</div><div class="hex">#132E41 · rgb(19,46,65)</div><div class="role" style="color:var(--peach-200)">Primary · backgrounds, logo, text on light</div></div>
<div class="sw" style="background:var(--navy-800);color:#fff"><div class="name">Navy 800</div><div class="hex">#102737</div></div>
<div class="sw" style="background:var(--navy-600);color:#fff"><div class="name">Navy 600</div><div class="hex">#1C4056</div></div>
<div class="sw" style="background:var(--navy-400);color:#fff"><div class="name">Navy 400</div><div class="hex">#3F6E89</div></div>
</div></body></html>

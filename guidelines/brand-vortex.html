<!-- @dsCard group="Brand" viewport="700x220" name="Spiral vortex pattern" subtitle="Reusable background motif — use at 8–20% opacity" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);display:flex}
.half{flex:1;position:relative;overflow:hidden;min-height:220px}
.dark{background:var(--brand-navy)}.light{background:var(--cream-50)}
.v{position:absolute;width:420px;height:420px;top:-120px;right:-120px}
.dark .v{opacity:.14}.light .v{opacity:.18}
.lab{position:absolute;bottom:14px;left:16px;font-size:11px;font-weight:700;letter-spacing:.06em}
.dark .lab{color:var(--peach-200)}.light .lab{color:var(--brand-navy)}</style></head>
<body>
<div class="half dark"><img class="v" src="../assets/patterns/spiral-vortex-white.svg" alt=""><span class="lab">spiral-vortex-white.svg · on navy @ 10–15%</span></div>
<div class="half light"><img class="v" src="../assets/patterns/spiral-vortex-navy.svg" alt=""><span class="lab">spiral-vortex-navy.svg · on cream @ 15–20%</span></div>
</body></html>

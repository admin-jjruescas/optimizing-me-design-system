<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--cream-50);padding:20px;display:flex;gap:20px;align-items:center}
.blob{width:180px;height:180px;object-fit:cover;border-radius:46% 54% 54% 46%/46% 46% 54% 54%}
.rect{width:150px;height:180px;object-fit:cover;border-radius:var(--radius-lg)}
.txt{flex:1;color:var(--brand-navy)}
.txt b{display:block;font-size:15px;font-weight:800;margin-bottom:6px}
.txt p{margin:0;font-size:13px;line-height:1.55;color:var(--text-muted)}</style></head>
<body>
<img class="blob" src="../assets/photos/jj-portrait-square-red.jpg" alt="JJ portrait, blob mask">
<img class="rect" src="../assets/photos/jj-portrait-gray-tee.jpg" alt="JJ portrait">
<div class="txt"><b>Warm, authentic, open</b><p>3/4 turn, neutral background, balanced light. Preferred treatment: biomorphic blob mask or rounded rectangle — never sharp full-bleed rectangles. Avoid heavy filters; keep skin tones natural.</p></div>
</body></html>

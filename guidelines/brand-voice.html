<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--brand-navy);padding:26px;color:#fff}
h4{margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-orange)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;font-size:13.5px;line-height:1.5}
.do:before{content:"✓ ";color:var(--brand-periwinkle);font-weight:900}
.no:before{content:"✕ ";color:var(--brand-pink);font-weight:900}
.no{color:var(--peach-200)}</style></head>
<body><h4>How Optimizing Me speaks</h4>
<div class="grid">
<div class="do">First-person, peer-to-peer authority</div><div class="no">Spiritual jargon ("energy healing")</div>
<div class="do">Science-grounded, measurable claims</div><div class="no">Hype or magical thinking</div>
<div class="do">Tech/systems analogies (nervous system = OS)</div><div class="no">Dumbed-down oversimplification</div>
<div class="do">Short punchy lines + longer rhythm</div><div class="no">Corporate wellness filler</div>
</div></body></html>

<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:24px;color:var(--brand-navy)}
.r{display:flex;align-items:center;gap:14px;padding:4px 0}
.bar{height:16px;background:var(--brand-periwinkle);border-radius:4px}
.lab{width:120px;font-size:12px;font-weight:700}.px{font-size:11px;color:var(--text-muted);font-weight:600}</style></head>
<body>
<div class="r"><div class="lab">space-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div></div>
<div class="r"><div class="lab">space-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div></div>
<div class="r"><div class="lab">space-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div></div>
<div class="r"><div class="lab">space-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div></div>
<div class="r"><div class="lab">space-5</div><div class="bar" style="width:24px"></div><div class="px">24px</div></div>
<div class="r"><div class="lab">space-6</div><div class="bar" style="width:32px"></div><div class="px">32px</div></div>
<div class="r"><div class="lab">space-7</div><div class="bar" style="width:48px"></div><div class="px">48px</div></div>
<div class="r"><div class="lab">space-8</div><div class="bar" style="width:64px"></div><div class="px">64px</div></div>
</body></html>

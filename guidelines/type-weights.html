<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:24px;color:var(--brand-navy)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 24px}
.w b{display:block;font-size:26px;line-height:1.1}.w span{font-size:11px;font-weight:600;color:var(--text-muted)}</style></head>
<body><div class="grid">
<div class="w"><b style="font-weight:400">Regular</b><span>400 · titles, body</span></div>
<div class="w"><b style="font-weight:500">Medium</b><span>500 · subtitles</span></div>
<div class="w"><b style="font-weight:600">Semi-Bold</b><span>600 · buttons, nav</span></div>
<div class="w"><b style="font-weight:700">Bold</b><span>700 · emphasis, labels</span></div>
<div class="w"><b style="font-weight:800">Extra Bold</b><span>800 · display</span></div>
<div class="w"><b style="font-weight:900">Black</b><span>900 · hero</span></div>
</div></body></html>

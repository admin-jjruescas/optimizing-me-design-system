<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Rounded / organic" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:24px;color:var(--brand-navy)}
.row{display:flex;gap:18px;align-items:flex-end}
.b{width:96px;height:72px;background:var(--peri-100);border:1.5px solid var(--brand-periwinkle)}
.c{text-align:center}.lab{font-size:11px;font-weight:700;margin-top:8px}</style></head>
<body><div class="row">
<div class="c"><div class="b" style="border-radius:var(--radius-sm)"></div><div class="lab">sm · 8px</div></div>
<div class="c"><div class="b" style="border-radius:var(--radius-md)"></div><div class="lab">md · 14px</div></div>
<div class="c"><div class="b" style="border-radius:var(--radius-lg)"></div><div class="lab">lg · 22px</div></div>
<div class="c"><div class="b" style="border-radius:var(--radius-xl)"></div><div class="lab">xl · 32px</div></div>
<div class="c"><div class="b" style="border-radius:var(--radius-pill);width:120px"></div><div class="lab">pill · 999px</div></div>
</div></body></html>

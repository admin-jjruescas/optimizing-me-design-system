<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation / shadows" subtitle="Soft, low-contrast depth" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--cream-50);padding:30px;color:var(--brand-navy)}
.row{display:flex;gap:28px}
.b{width:130px;height:80px;background:#fff;border-radius:var(--radius-lg);display:grid;place-items:center;font-size:11px;font-weight:700}</style></head>
<body><div class="row">
<div class="b" style="box-shadow:var(--shadow-sm)">shadow-sm</div>
<div class="b" style="box-shadow:var(--shadow-md)">shadow-md</div>
<div class="b" style="box-shadow:var(--shadow-lg)">shadow-lg</div>
<div class="b" style="box-shadow:var(--shadow-accent);background:var(--brand-orange);color:#fff">shadow-accent</div>
</div></body></html>

<!-- @dsCard group="Colors" viewport="700x170" name="Brand gradients" subtitle="Five official diagonal gradients" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:20px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.sw{border-radius:var(--radius-md);min-height:96px;display:flex;align-items:flex-end;padding:12px}
.name{font-weight:800;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}</style></head>
<body><div class="grid">
<div class="sw" style="background:var(--gradient-warm)"><div class="name">Warm</div></div>
<div class="sw" style="background:var(--gradient-dynamic)"><div class="name">Dynamic</div></div>
<div class="sw" style="background:var(--gradient-cool)"><div class="name">Cool</div></div>
<div class="sw" style="background:var(--gradient-bold)"><div class="name">Bold</div></div>
<div class="sw" style="background:var(--gradient-soft)"><div class="name" style="color:var(--brand-navy);text-shadow:none">Soft</div></div>
</div></body></html>

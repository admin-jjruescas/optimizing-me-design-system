<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimizing Me — JJ Ruescas</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg-page)}
  a:hover{opacity:.72}a{transition:opacity var(--dur-fast) var(--ease-standard)}
  .mob-only{display:none}
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
  .pillar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .prog-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  .quote-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .radial{position:absolute;top:-140px;right:-160px;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle at center, rgba(117,146,190,.28), transparent 62%);pointer-events:none}
  @media(max-width:900px){
    .desk-nav{display:none!important}.mob-only{display:inline-flex}
    .hero-grid{grid-template-columns:1fr;gap:32px}
    .pillar-grid{grid-template-columns:1fr 1fr}
    .prog-grid,.quote-grid{grid-template-columns:1fr}
    .form-row{flex-direction:column!important}
  }
  @media(max-width:560px){.pillar-grid{grid-template-columns:1fr}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>

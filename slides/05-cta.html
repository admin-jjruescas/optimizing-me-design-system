<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}body{margin:0}
.slide{width:1080px;height:1080px;font-family:var(--font-sans);background:var(--gradient-warm);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:110px}
.veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 120%, rgba(19,46,65,.5), transparent 60%)}
.eb{font-size:24px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-navy);position:relative}
h2{font-family:var(--font-display);font-weight:900;font-size:100px;line-height:1.0;color:#fff;margin:26px 0 0;position:relative;text-shadow:0 2px 20px rgba(19,46,65,.25)}
p{font-size:34px;line-height:1.45;color:#fff;max-width:640px;margin:30px 0 0;position:relative}
.btn{margin-top:56px;background:var(--brand-navy);color:#fff;font-weight:700;font-size:32px;padding:26px 56px;border-radius:999px;position:relative;display:inline-flex;align-items:center;gap:18px}
.handle{position:absolute;bottom:70px;font-size:26px;font-weight:800;color:#fff;letter-spacing:.04em;position:relative}
.sym{position:absolute;top:80px;height:70px;opacity:.95}
</style></head>
<body><div class="slide">
<div class="veil"></div>
<img class="sym" src="../assets/logos/symbol-white.png" alt="">
<span class="eb">Your move</span>
<h2>Start your 1% today.</h2>
<p>Save this post and follow for a daily optimization — mind, body, and nervous system.</p>
<span class="btn">Follow @optimizando.me
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
</div></body></html>

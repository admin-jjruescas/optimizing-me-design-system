<!-- @dsCard group="Slides" viewport="1080x1080" name="04 · Quote Card" subtitle="Template Pattern 4 — Quote" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}body{margin:0}
.slide{width:1080px;height:1080px;font-family:var(--font-sans);background:var(--brand-navy);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:120px}
.crescent{position:absolute;top:-160px;right:-160px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle at 30% 70%, transparent 58%, var(--brand-pink) 58% 63%, transparent 63%)}
.crescent2{position:absolute;bottom:-200px;left:-160px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 70% 30%, transparent 60%, var(--brand-periwinkle) 60% 64%, transparent 64%)}
.q{font-family:var(--font-display);font-weight:900;font-size:150px;line-height:.6;color:var(--brand-orange);position:relative}
blockquote{font-weight:800;font-size:60px;line-height:1.18;margin:20px 0 0;position:relative;letter-spacing:-.005em}
blockquote .hl{color:var(--brand-orange)}
.attr{margin-top:52px;display:flex;align-items:center;gap:20px;position:relative}
.attr img{height:52px}
.attr .t{font-size:26px;font-weight:700;color:var(--peach-200);letter-spacing:.04em}
</style></head>
<body><div class="slide">
<div class="crescent"></div><div class="crescent2"></div>
<span class="q">&ldquo;</span>
<blockquote>A small change made <span class="hl">consistently</span> beats a big change made once.</blockquote>
<div class="attr"><img src="../assets/logos/symbol-white.png" alt=""><span class="t">JJ RUESCAS · OPTIMIZING ME</span></div>
</div></body></html>

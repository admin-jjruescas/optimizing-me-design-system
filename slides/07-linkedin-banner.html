<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}body{margin:0}
.slide{width:1200px;height:627px;background:var(--brand-navy);color:#fff;position:relative;overflow:hidden;font-family:var(--font-sans);display:grid;grid-template-columns:1.25fr .75fr;align-items:center}
.vortex{position:absolute;top:-180px;right:-180px;width:640px;height:640px;opacity:.12}
.left{padding:70px 20px 70px 80px;position:relative}
.eb{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-orange)}
.eb .dot{width:8px;height:8px;border-radius:99px;background:currentColor}
h1{font-family:var(--font-display);font-weight:900;font-size:64px;line-height:1.02;letter-spacing:-.01em;margin:18px 0 0}
h1 .o{color:var(--brand-orange)}
p{font-size:23px;line-height:1.5;color:var(--peach-200);margin:20px 0 0;max-width:560px}
.logo{position:absolute;bottom:-16px;left:80px;height:40px}
.right{position:relative;height:100%;display:grid;place-items:center}
.photo{width:300px;height:300px;object-fit:cover;border-radius:46% 54% 54% 46%/46% 46% 54% 54%;box-shadow:var(--shadow-lg);position:relative}
.band{position:absolute;bottom:0;left:0;right:0;height:14px;background:var(--gradient-warm)}
</style></head>
<body><div class="slide">
<img class="vortex" src="../assets/patterns/spiral-vortex-white.svg" alt="">
<div class="left">
<span class="eb"><span class="dot"></span>Live workshop · Online</span>
<h1>Debug your <span class="o">nervous system.</span></h1>
<p>Breathwork, mindset & the science of the 1% — with JJ Ruescas.</p>
</div>
<div class="right"><img class="photo" src="../assets/photos/jj-portrait-gray-tee.jpg" alt="JJ Ruescas"></div>
<img class="logo" src="../assets/logos/logo-jj-tagline-white.png" alt="JJ Ruescas — Optimizing Me" style="position:absolute;bottom:36px;left:80px;height:44px">
<div class="band"></div>
</div></body></html>

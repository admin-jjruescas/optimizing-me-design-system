<!-- @dsCard group="Slides" viewport="1080x1080" name="02 · Split Orange/Navy" subtitle="Template Pattern 2 — Split section" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}body{margin:0}
.slide{width:1080px;height:1080px;font-family:var(--font-sans);display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--brand-orange);color:#fff;flex:0 0 42%;padding:96px 110px;display:flex;flex-direction:column;justify-content:center}
.top .eb{font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-navy)}
.top h2{font-family:var(--font-display);font-weight:900;font-size:82px;line-height:1.02;margin:22px 0 0}
.bot{background:var(--brand-navy);color:#fff;flex:1;padding:80px 110px;display:flex;flex-direction:column;justify-content:center;gap:34px;position:relative}
.item{display:flex;gap:26px;align-items:flex-start}
.num{flex:0 0 auto;width:62px;height:62px;border-radius:99px;background:rgba(255,255,255,.1);border:2px solid var(--brand-orange);color:var(--brand-orange);display:grid;place-items:center;font-weight:900;font-size:28px}
.item p{margin:0;font-size:32px;line-height:1.45}
.item b{color:#fff;font-weight:800}.item span{color:var(--peach-200)}
.sym{position:absolute;bottom:56px;right:110px;height:50px;opacity:.9}
</style></head>
<body><div class="slide">
<div class="top">
<span class="eb">Nervous System 101</span>
<h2>Stressed? Reset in 3 breaths.</h2>
</div>
<div class="bot">
<div class="item"><div class="num">1</div><p><b>Exhale longer than you inhale.</b> <span>It flips you into rest-and-digest.</span></p></div>
<div class="item"><div class="num">2</div><p><b>Breathe through your nose.</b> <span>Slower, deeper, more oxygen exchange.</span></p></div>
<div class="item"><div class="num">3</div><p><b>Drop the shoulders.</b> <span>Tell the body the threat is over.</span></p></div>
<img class="sym" src="../assets/logos/symbol-white.png" alt="Optimizing Me">
</div>
</div></body></html>

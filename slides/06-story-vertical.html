<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}body{margin:0}
.slide{width:1080px;height:1920px;background:var(--brand-navy);color:#fff;position:relative;overflow:hidden;font-family:var(--font-sans);display:flex;flex-direction:column;justify-content:flex-end;padding:120px 100px 160px}
.vortex{position:absolute;top:-260px;right:-300px;width:900px;height:900px;opacity:.13}
.photo{position:absolute;top:180px;left:50%;transform:translateX(-50%);width:520px;height:520px;object-fit:cover;border-radius:46% 54% 54% 46%/46% 46% 54% 54%;box-shadow:var(--shadow-lg)}
.eb{display:inline-flex;align-items:center;gap:14px;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-orange);position:relative}
.eb .dot{width:12px;height:12px;border-radius:99px;background:currentColor}
h1{font-family:var(--font-display);font-weight:900;font-size:120px;line-height:1;letter-spacing:-.01em;margin:30px 0 0;position:relative}
h1 .o{color:var(--brand-orange)}
p{font-size:38px;line-height:1.5;color:var(--peach-200);margin:36px 0 0;position:relative}
.cta{margin-top:60px;align-self:flex-start;background:var(--brand-orange);color:#fff;font-weight:800;font-size:34px;padding:28px 60px;border-radius:999px;position:relative;box-shadow:var(--shadow-accent)}
.sym{position:absolute;top:120px;left:100px;height:70px}
</style></head>
<body><div class="slide">
<img class="vortex" src="../assets/patterns/spiral-vortex-white.svg" alt="">
<img class="sym" src="../assets/logos/symbol-white.png" alt="Optimizing Me">
<img class="photo" src="../assets/photos/jj-portrait-square-red.jpg" alt="JJ Ruescas">
<span class="eb"><span class="dot"></span>Daily reset</span>
<h1>Breathe.<br>Then <span class="o">decide.</span></h1>
<p>3 slow exhales before your next hard conversation. Your nervous system will thank you.</p>
<span class="cta">Try it with me → @optimizando.me</span>
</div></body></html>

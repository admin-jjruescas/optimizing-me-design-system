<!-- @dsCard group="Slides" viewport="1080x1080" name="01 · Dark Hero cover" subtitle="Template Pattern 1 — Navy cover" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}body{margin:0}
.slide{width:1080px;height:1080px;background:var(--brand-navy);color:#fff;position:relative;overflow:hidden;font-family:var(--font-sans);display:flex;flex-direction:column;justify-content:center;padding:110px}
.spiral{position:absolute;inset:0;background:
  repeating-conic-gradient(from 0deg at 78% 22%, rgba(117,146,190,.14) 0deg 2deg, transparent 2deg 9deg);
  -webkit-mask:radial-gradient(circle at 78% 22%, #000 0, #000 340px, transparent 460px);
  mask:radial-gradient(circle at 78% 22%, #000 0, #000 340px, transparent 460px)}
.eb{display:inline-flex;align-items:center;gap:14px;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-orange);position:relative}
.eb .dot{width:12px;height:12px;border-radius:99px;background:currentColor}
h1{font-family:var(--font-display);font-weight:900;font-size:132px;line-height:.98;letter-spacing:-.01em;margin:34px 0 0;position:relative}
h1 .o{color:var(--brand-orange)}
p{font-size:34px;line-height:1.5;color:var(--peach-200);max-width:720px;margin:40px 0 0;position:relative}
.sym{position:absolute;bottom:70px;left:110px;height:64px}
.swipe{position:absolute;bottom:74px;right:110px;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700;color:#fff}
</style></head>
<body><div class="slide">
<div class="spiral"></div>
<span class="eb"><span class="dot"></span>The HumanOps Framework</span>
<h1>Optimize<br>your <span class="o">1%.</span></h1>
<p>Practical personal development, grounded in the nervous system — one human at a time.</p>
<img class="sym" src="../assets/logos/symbol-white.png" alt="Optimizing Me">
<span class="swipe">Swipe
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
</div></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--cream-50);padding:24px;color:var(--brand-navy)}
h5{margin:20px 0 10px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
h5:first-child{margin-top:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Badge, Tag, Card, Stat, Testimonial } = window.OptimizingMeDesignSystem_7c7534;
const Ico = ({d})=><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
const Arrow = <Ico d={<path d="M5 12h14M13 6l6 6-6 6"/>}/>;
const Play = <Ico d={<polygon points="6 4 20 12 6 20 6 4"/>}/>;
const Menu = <Ico d={<g><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></g>}/>;
function App(){
  const [active,setActive]=React.useState('Breathwork');
  const tags=['Breathwork','Nervous System','AI & Tech','Liderazgo'];
  return <div>
    <h5>Buttons</h5>
    <div className="row">
      <Button variant="primary">Start optimizing</Button>
      <Button variant="secondary">Book a call</Button>
      <Button variant="outline" iconEnd={Arrow}>The framework</Button>
      <Button variant="ghost">Learn more</Button>
      <Button variant="primary" disabled>Disabled</Button>
    </div>
    <div className="row" style={{marginTop:12}}>
      <Button variant="primary" size="sm">Small</Button>
      <Button variant="primary" size="md">Medium</Button>
      <Button variant="primary" size="lg">Large</Button>
      <IconButton label="Play" variant="accent">{Play}</IconButton>
      <IconButton label="Menu" variant="soft">{Menu}</IconButton>
      <IconButton label="Next" variant="solid">{Arrow}</IconButton>
    </div>
    <h5>Badges & Tags</h5>
    <div className="row">
      <Badge tone="orange">New</Badge>
      <Badge tone="navy">IGNITE</Badge>
      <Badge tone="periwinkle">Breathwork</Badge>
      <Badge tone="peach">8 weeks</Badge>
      <Badge tone="outline">Free</Badge>
    </div>
    <div className="row" style={{marginTop:12}}>
      {tags.map(t=><Tag key={t} active={active===t} onClick={()=>setActive(t)}>{t}</Tag>)}
    </div>
    <h5>Cards, Stat & Testimonial</h5>
    <div className="grid2">
      <Card tone="light" accent="var(--accent)">
        <div style={{fontWeight:800,fontSize:18,marginBottom:6}}>Kaizen</div>
        <div style={{display:'flex',gap:28}}>
          <Stat value="1" suffix="%" label="better, every day"/>
          <Stat value="6" label="HumanOps pillars"/>
        </div>
      </Card>
      <Testimonial tone="dark" quote="Breathwork rewired how I handle stress before big meetings." name="Ana M." role="Product Lead"/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
